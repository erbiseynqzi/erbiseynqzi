<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Turgay Memmedli - Junior Penetration Tester">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="55%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#8ad9ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" y1="172" x2="0" y2="300">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="35%" stop-color="#777777"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="fade">
      <rect x="0" y="168" width="1000" height="132" fill="url(#fadeGrad)"/>
    </mask>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: "Verdana", "DejaVu Sans", "Segoe UI", sans-serif; }

      .scan { animation: sweep 7s linear infinite; }
      @keyframes sweep {
        0%   { transform: translateY(168px); opacity: 0; }
        12%  { opacity: 0.9; }
        88%  { opacity: 0.5; }
        100% { transform: translateY(300px); opacity: 0; }
      }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

      .grid { animation: gridPulse 5s ease-in-out infinite; }
      @keyframes gridPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 0.9; } }

      .cubeA { animation: floatA 8s ease-in-out infinite; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      .cubeB { animation: floatB 11s ease-in-out infinite; }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
      .cubeC { animation: floatC 9.5s ease-in-out infinite; }
      @keyframes floatC { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(6px); } }

      .spark { animation: twinkle 3.4s ease-in-out infinite; }
      .spark2 { animation: twinkle 4.6s ease-in-out infinite; }
      .spark3 { animation: twinkle 5.8s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.95; } }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>
  <rect width="1000" height="300" fill="url(#halo)"/>

  <!-- perspective floor -->
  <g mask="url(#fade)" class="grid">
    <g stroke="#00d9ff" stroke-opacity="0.30" stroke-width="1">
      <line x1="500" y1="172" x2="-620" y2="300"/>
      <line x1="500" y1="172" x2="-380" y2="300"/>
      <line x1="500" y1="172" x2="-160" y2="300"/>
      <line x1="500" y1="172" x2="40"  y2="300"/>
      <line x1="500" y1="172" x2="210" y2="300"/>
      <line x1="500" y1="172" x2="360" y2="300"/>
      <line x1="500" y1="172" x2="500" y2="300"/>
      <line x1="500" y1="172" x2="640" y2="300"/>
      <line x1="500" y1="172" x2="790" y2="300"/>
      <line x1="500" y1="172" x2="960" y2="300"/>
      <line x1="500" y1="172" x2="1160" y2="300"/>
      <line x1="500" y1="172" x2="1380" y2="300"/>
      <line x1="500" y1="172" x2="1620" y2="300"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1">
      <line x1="0" y1="176" x2="1000" y2="176"/>
      <line x1="0" y1="183" x2="1000" y2="183"/>
      <line x1="0" y1="193" x2="1000" y2="193"/>
      <line x1="0" y1="207" x2="1000" y2="207"/>
      <line x1="0" y1="226" x2="1000" y2="226"/>
      <line x1="0" y1="250" x2="1000" y2="250"/>
      <line x1="0" y1="281" x2="1000" y2="281"/>
    </g>
  </g>

  <!-- horizon light -->
  <ellipse cx="500" cy="172" rx="300" ry="7" fill="#00d9ff" opacity="0.16" filter="url(#glow)"/>

  <!-- moving scan line -->
  <rect class="scan" x="0" y="0" width="1000" height="2" fill="url(#scanGrad)"/>

  <!-- floating isometric cubes -->
  <g transform="translate(128,96)" filter="url(#softglow)"><g class="cubeA">
    <path d="M0,-22 L19,-11 L0,0 L-19,-11 Z" fill="#00d9ff" fill-opacity="0.20" stroke="#00d9ff" stroke-opacity="0.75" stroke-width="1"/>
    <path d="M-19,-11 L0,0 L0,22 L-19,11 Z" fill="#0ea5e9" fill-opacity="0.10" stroke="#00d9ff" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M19,-11 L0,0 L0,22 L19,11 Z" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1"/>
  </g></g>

  <g transform="translate(872,112)" filter="url(#softglow)"><g class="cubeB">
    <path d="M0,-16 L14,-8 L0,0 L-14,-8 Z" fill="#a78bfa" fill-opacity="0.20" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1"/>
    <path d="M-14,-8 L0,0 L0,16 L-14,8 Z" fill="#7c3aed" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M14,-8 L0,0 L0,16 L14,8 Z" fill="#00d9ff" fill-opacity="0.10" stroke="#00d9ff" stroke-opacity="0.50" stroke-width="1"/>
  </g></g>

  <g transform="translate(806,58)" opacity="0.75"><g class="cubeC">
    <path d="M0,-11 L10,-5.5 L0,0 L-10,-5.5 Z" fill="#ff8c42" fill-opacity="0.18" stroke="#ff8c42" stroke-opacity="0.60" stroke-width="1"/>
    <path d="M-10,-5.5 L0,0 L0,11 L-10,5.5 Z" fill="#ff8c42" fill-opacity="0.06" stroke="#ff8c42" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M10,-5.5 L0,0 L0,11 L10,5.5 Z" fill="#ff8c42" fill-opacity="0.10" stroke="#ff8c42" stroke-opacity="0.45" stroke-width="1"/>
  </g></g>

  <g transform="translate(196,52)" opacity="0.6"><g class="cubeC">
    <path d="M0,-9 L8,-4.5 L0,0 L-8,-4.5 Z" fill="#00d9ff" fill-opacity="0.18" stroke="#00d9ff" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M-8,-4.5 L0,0 L0,9 L-8,4.5 Z" fill="#00d9ff" fill-opacity="0.05" stroke="#00d9ff" stroke-opacity="0.30" stroke-width="1"/>
    <path d="M8,-4.5 L0,0 L0,9 L8,4.5 Z" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.40" stroke-width="1"/>
  </g></g>

  <!-- sparks -->
  <circle class="spark"  cx="300" cy="64"  r="1.8" fill="#00d9ff"/>
  <circle class="spark2" cx="700" cy="48"  r="1.6" fill="#a78bfa"/>
  <circle class="spark3" cx="600" cy="88"  r="1.4" fill="#ff8c42"/>
  <circle class="spark2" cx="410" cy="40"  r="1.4" fill="#00d9ff"/>
  <circle class="spark3" cx="760" cy="140" r="1.6" fill="#a78bfa"/>
  <circle class="spark"  cx="240" cy="150" r="1.5" fill="#00d9ff"/>

  <!-- terminal line -->
  <g class="mono" font-size="13">
    <text x="40" y="42" fill="#00d9ff" fill-opacity="0.85">root@erbiseynqzi</text>
    <text x="164" y="42" fill="#8b9bb4">:~$ ./engage --scope self</text>
    <rect class="cursor" x="366" y="32" width="7" height="13" fill="#00d9ff"/>
    <text x="960" y="42" fill="#8b9bb4" text-anchor="end" font-size="12">BAKU · AZ</text>
  </g>

  <!-- extruded 3D title -->
  <g class="sans" text-anchor="middle" font-weight="700" letter-spacing="5">
    <text x="507" y="127" font-size="54" fill="#1e1145">TURGAY MEMMEDLI</text>
    <text x="506" y="126" font-size="54" fill="#2a1a5e">TURGAY MEMMEDLI</text>
    <text x="505" y="125" font-size="54" fill="#35237a">TURGAY MEMMEDLI</text>
    <text x="504" y="124" font-size="54" fill="#3f2b91">TURGAY MEMMEDLI</text>
    <text x="503" y="123" font-size="54" fill="#4a34a8">TURGAY MEMMEDLI</text>
    <text x="502" y="122" font-size="54" fill="#553dbf">TURGAY MEMMEDLI</text>
    <text x="501" y="121" font-size="54" fill="#6046d6">TURGAY MEMMEDLI</text>
    <text x="500" y="120" font-size="54" fill="url(#title)" filter="url(#glow)">TURGAY MEMMEDLI</text>
  </g>

  <!-- subtitle + credentials -->
  <g text-anchor="middle">
    <text class="mono" x="500" y="152" font-size="15" letter-spacing="7" fill="#8b9bb4">JUNIOR PENETRATION TESTER</text>
    <text class="mono" x="500" y="286" font-size="12" letter-spacing="3" fill="#5b6b85">eCPPT · eJPT · Web-RTA · CWSE · CAPT</text>
  </g>
</svg>
